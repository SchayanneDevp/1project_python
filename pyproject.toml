[project]
name = "1project"
version = "0.1.0"
description = "Mi primer proyecto reproducible"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
